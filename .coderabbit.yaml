# https://docs.coderabbit.ai/configuration/yaml-configuration
language: zh-CN
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
chat:
  auto_reply: true
path_filters:
  - "!**/.build/**"
  - "!**/build/**"
  - "!**/*.xcuserstate"
