name: Release

# 推 v* 标签时触发：构建 DMG 并创建 GitHub Release
# 用法：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        env:
          # 从 tag 提取版本号（v0.1.0 -> 0.1.0），与 build.sh 的 VERSION 对齐
          LUMEN_VERSION: ${{ github.ref_name }}
        run: |
          # github.ref_name 形如 v0.1.0，去掉前缀 v
          export LUMEN_VERSION="${LUMEN_VERSION#v}"
          ./build.sh

      - name: Sign DMG and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG="build/Lumen-${VERSION}.dmg"

          SIG_OUTPUT="$(swift scripts/sign_update.swift "${DMG}" "${SPARKLE_PRIVATE_KEY}")"
          echo "${SIG_OUTPUT}"
          ED_SIG="$(echo "${SIG_OUTPUT}" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(echo "${SIG_OUTPUT}" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          cat > build/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Lumen 更新</title>
              <item>
                <title>Lumen ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/yanghuanrong/Lumen/releases/download/${TAG}/Lumen-${VERSION}.dmg"
                  sparkle:edSignature="${ED_SIG}"
                  length="${LENGTH}"
                  type="application/x-apple-diskimage"
                />
              </item>
            </channel>
          </rss>
          APPCAST

          cat build/appcast.xml

      - name: Create release and upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" build/Lumen-*.dmg build/appcast.xml \
            --title "Lumen $TAG" \
            --generate-notes

      - name: Update README DMG size badge
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BYTES="$(stat -f%z "build/Lumen-${VERSION}.dmg")"
          # 按数值自动选 KB / MB
          if [ "${BYTES}" -ge 1048576 ]; then
            SIZE="$(awk "BEGIN{printf \"%.1f\", ${BYTES}/1048576}")MB"
          else
            SIZE="$(awk "BEGIN{printf \"%.1f\", ${BYTES}/1024}")KB"
          fi
          echo "DMG 体积: ${SIZE}"

          # 切回 main（tag checkout 是 detached HEAD）
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # 替换 README 中的 DMG 体积徽章（静态徽章，每次发版刷新）
          sed -i '' -E \
            "s|(\\[!\\[DMG 体积\\]\\()https[^)]*(\\)\\].*)|\\1https://img.shields.io/badge/DMG%E4%BD%93%E7%A7%AF-${SIZE}-blue\\2|" \
            README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 无变化，跳过提交"
          else
            git commit -m "docs: 更新 DMG 体积徽章为 ${SIZE} [skip ci]"
            git push origin main
          fi
